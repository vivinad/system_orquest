<section class="metodos">
  <h2 class="metodos-titulo">Aceptamos estos medios de pago</h2>
  <ul class="metodos-lista">
    @for (m of metodos; track m.imagen) {
      <li class="metodo" [title]="m.nombre">
        <img [src]="m.imagen" [alt]="'Pago con ' + m.nombre">
        <span>{{ m.detalle }}</span>
      </li>
    }
  </ul>
</section>
